name: Factory

# Started by the app repos when an issue gets the ready label. Can also be
# started by hand from the Actions tab.
on:
  repository_dispatch:
    types: [issue-ready]
  workflow_dispatch:
    inputs:
      repo:
        description: App repo, for example owner/name
        required: true
      issue:
        description: Issue number
        required: true

# Least privilege. The workflow itself never writes: the factory pushes and
# opens pull requests with its own scoped token, not with GITHUB_TOKEN.
permissions:
  contents: read

# One run per issue at a time. A second run for the same issue waits, then
# finds the ready label gone and stops.
concurrency:
  group: "issue-${{ github.event.client_payload.repo || inputs.repo }}-${{ github.event.client_payload.issue || inputs.issue }}"
  cancel-in-progress: false

run-name: "${{ github.event.client_payload.repo || inputs.repo }} #${{ github.event.client_payload.issue || inputs.issue }}"

jobs:
  work:
    runs-on: ubuntu-latest
    # Must stay above the worst case in factory.config.json: waiting for a worker,
    # setup, two agent runs and two rounds of checks. scripts/check-setup.mjs
    # does the sum. A run that hits this limit skips its cleanup.
    timeout-minutes: 150
    # No secrets at job level on purpose.
    #
    # Everything secret is attached to the single step that needs it, below. A
    # job level env would put every secret in the environment of every step,
    # including `npm ci`, whose dependency lifecycle scripts would then be able
    # to read all of them. Scoping them means a compromised transitive
    # dependency only ever sees the environment of a step it was not installed
    # into.
    #
    # Only two values are needed before the worker is claimed: which issue, and
    # where to find it. The agent sign-in secrets are only needed by the run
    # step, once a worker and its agent type are known.
    env:
      FACTORY_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
      FACTORY_ISSUE: ${{ github.event.client_payload.issue || inputs.issue }}
    steps:
      # Actions are pinned to immutable commit SHAs, not floating tags, so a
      # moved or replaced tag cannot change what runs here. Dependabot keeps
      # these current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # Runs with no factory secret in its environment at all.
      - run: npm ci

      - name: Show the plan
        env:
          UPSTASH_BOX_API_KEY: ${{ secrets.UPSTASH_BOX_API_KEY }}
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: node src/plan.mjs

      # Set the repo variable FACTORY_DRY_RUN to true to stop after the plan. Useful
      # while proving the trigger, before any agent is allowed to run.
      - name: Do the work and open a pull request
        if: vars.FACTORY_DRY_RUN != 'true'
        env:
          UPSTASH_BOX_API_KEY: ${{ secrets.UPSTASH_BOX_API_KEY }}
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          # Every secret as one JSON blob, attached here and only here. The
          # agents' sign-in secrets are read from it by name, so adding an agent
          # never means editing this file.
          FACTORY_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: node src/run.mjs